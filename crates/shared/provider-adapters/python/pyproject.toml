[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "soma-provider"
version = "0.1.0"
description = "Dependency-free authoring helpers for Soma Python providers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Dinglebear AI" }]
keywords = ["soma", "providers", "mcp", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://soma.dinglebear.ai"
Repository = "https://github.com/dinglebear-ai/soma"
Documentation = "https://github.com/dinglebear-ai/soma/blob/main/docs/PROVIDERS.md"

[tool.setuptools]
py-modules = ["soma_provider"]
