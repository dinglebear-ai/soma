[package]
name = "cortex-inventory"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Pure Cortex inventory snapshot contracts and bounded inventory helpers."
homepage.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
readme = "README.md"
keywords = ["inventory", "observability", "homelab", "topology"]
