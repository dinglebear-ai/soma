[package]
name = "soma-self-update"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Standalone, transport-neutral binary self-update transaction for Rust services"
license = "AGPL-3.0-only"
readme = "README.md"
publish = false

[package.metadata.soma-architecture]
layer = "shared"

[dependencies]
process-wrap = { version = "10.0", default-features = false, features = [
    "tokio1",
    "kill-on-drop",
    "process-group",
    "job-object",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "time"] }
url = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["fs", "process", "signal", "user"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
