[package]
name = "soma-cli-core"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Reusable CLI plumbing: output formats, JSON rendering, confirmation I/O, and terminal/color capability policy"
homepage.workspace = true
license = "AGPL-3.0-only"
repository.workspace = true
readme = "README.md"
keywords = ["cli", "terminal", "color", "json"]
categories = ["command-line-interface"]
publish = false

[package.metadata.soma-architecture]
layer = "shared"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
