[package]
name = "soma-ops"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Transport-neutral operation contracts, plans, progress, verification, and lifecycle events"
homepage.workspace = true
license = "MIT"
repository.workspace = true
readme = "README.md"
keywords = ["operations", "infrastructure", "workflow", "audit"]
categories = ["development-tools", "data-structures"]
publish = false

[package.metadata.soma-architecture]
layer = "shared"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
schema = ["dep:schemars"]

[dependencies]
schemars = { version = "=1.2.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
