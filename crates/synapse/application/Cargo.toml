[package]
name = "synapse-application"
version = "0.6.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Canonical product application runtime for Synapse operations"
homepage.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[package.metadata.soma-architecture]
layer = "product-application"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
jsonschema = "0.52"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
soma-fleet = { workspace = true }
soma-infra = { workspace = true }
soma-ops = { workspace = true }
thiserror = "2"
tokio-util = { version = "0.7", default-features = false }

[lints]
workspace = true

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt"] }
