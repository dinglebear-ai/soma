# =============================================================================
# .github/workflows/release.yml — Build release binaries and GitHub Release
#
# CUSTOMIZATION NOTES:
#   BINARY_NAME  → your binary name from Cargo.toml [[bin]] (e.g. "myservice")
#   REPO_NAME    → your GitHub repo name (e.g. "myservice-mcp")
#
# Customize binary-name references in this file if you fork Soma.
#
# Trigger: release-please publishes a GitHub Release.
#
# What this does:
#   1. Builds release binaries for linux/amd64 and windows/amd64
#   2. Uploads versioned archives and checksums to the existing GitHub Release
#   3. Publishes the @dinglebear/soma npm launcher package
# =============================================================================

name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vX.Y.Z release tag to resume
        required: true
        type: string

permissions:
  contents: write
  id-token: write

env:
  # CUSTOMIZE: Replace "soma" with your binary name.
  BINARY_NAME: soma
  CARGO_INCREMENTAL: "0"
  # Release builds route through kache (RUSTC_WRAPPER) and its compiler cache.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

jobs:
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.event.release.tag_name || inputs.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      release_ref: ${{ steps.validate.outputs.release_ref }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Validate release tag
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release artifacts must be published from a semver tag like v1.2.3, got ${tag}" >&2
            exit 1
          fi
          git fetch --force --tags origin main
          tag_commit="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" || true)"
          if [[ -z "${tag_commit}" ]]; then
            echo "Release tag ${tag} does not exist as refs/tags/${tag}" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${tag_commit}" origin/main; then
            echo "Release tag ${tag} is not reachable from origin/main" >&2
            exit 1
          fi
          version="${tag#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' apps/soma/Cargo.toml | head -n 1)"
          npm_version="$(python3 -c 'import json; print(json.load(open("packages/soma-rmcp/package.json"))["version"])')"
          if [[ "${cargo_version}" != "${version}" ]]; then
            echo "apps/soma/Cargo.toml version ${cargo_version} does not match ${tag}" >&2
            exit 1
          fi
          if [[ "${npm_version}" != "${version}" ]]; then
            echo "packages/soma-rmcp/package.json version ${npm_version} does not match ${tag}" >&2
            exit 1
          fi
          # Keep this short validation build isolated from any stale shared-runner
          # target entries while retaining kache's compiler cache layers.
          CARGO_TARGET_DIR="${RUNNER_TEMP}/soma-version-sync-target" \
            cargo xtask check-version-sync
          {
            echo "release_tag=${tag}"
            echo "release_ref=refs/tags/${tag}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

  frontend-assets:
    name: Frontend Assets
    needs: validate-release-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release-tag.outputs.release_ref }}

      - name: Set up mise tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4
        with:
          install_args: node pnpm
          cache: true

      - name: Build web assets
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload web export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-out
          path: apps/web/out/
          if-no-files-found: error
          retention-days: 1

  # ── Build release binaries ────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    needs: [validate-release-tag, frontend-assets]
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux/amd64 — most common deployment target
          - target: x86_64-unknown-linux-gnu
            arch: linux-x86_64
            ext: ""
          # windows/amd64 — cross-compiled via MinGW
          - target: x86_64-pc-windows-gnu
            arch: windows-x86_64
            ext: ".exe"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release-tag.outputs.release_ref }}

      - name: Download web export
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: web-out
          path: apps/web/out

      - name: Install Rust target and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}

      # workflow_dispatch loads this workflow from main but checks out the
      # requested release tag above. Keep this explicit guard so an older tag
      # can be rebuilt even when its local setup action predates the
      # active-toolchain target fix.
      - name: Ensure target is installed for pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          active_toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          rustup target add --toolchain "${active_toolchain}" "${{ matrix.target }}"

      # Cross-compilation toolchain for Windows on Linux runners.
      - name: Install cross-compilation tools (windows only)
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          # the setup action exports target-specific CC/CXX values for the host
          # compiler. Override them after setup so native dependencies such as
          # aws-lc-sys are compiled with MinGW for the requested Windows target.
          {
            echo "CC_x86_64_pc_windows_gnu=x86_64-w64-mingw32-gcc"
            echo "CXX_x86_64_pc_windows_gnu=x86_64-w64-mingw32-g++"
            echo "AR_x86_64_pc_windows_gnu=x86_64-w64-mingw32-ar"
          } >> "$GITHUB_ENV"

      # CUSTOMIZE: If you need OpenSSL, add it here:
      #   sudo apt-get install -y libssl-dev
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libseccomp-dev

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target
          # CUSTOMIZE: Change "soma" to your repo name.
          key: ${{ github.repository }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.repository }}-release-${{ matrix.target }}-

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            --bin ${{ env.BINARY_NAME }} --features full

      - name: Prepare binary artifact
        run: |
          mkdir -p package artifacts
          # CUSTOMIZE: Replace the binary name if you fork Soma.
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${{ matrix.ext }} \
             package/${{ env.BINARY_NAME }}${{ matrix.ext }}
          chmod +x package/${{ env.BINARY_NAME }}${{ matrix.ext }}
          tar -C package -czf artifacts/${{ env.BINARY_NAME }}-${{ matrix.arch }}.tar.gz \
            ${{ env.BINARY_NAME }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.arch }}
          path: artifacts/

  npm:
    name: Publish @dinglebear/soma to npm
    needs: [validate-release-tag, release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@e04c7ee5b494b376372023194cb418200761c722
    with:
      checkout-ref: ${{ needs.validate-release-tag.outputs.release_ref }}
      expected-version: ${{ needs.validate-release-tag.outputs.version }}
      working-directory: packages/soma-rmcp
      cache-dependency-path: packages/soma-rmcp/package.json
      install-command: "true"
      verify-command: node scripts/sync-readme.js && npm test && npm run check

  # ── Upload GitHub Release assets ─────────────────────────────────────────────
  release:
    name: Upload GitHub Release assets
    needs: [validate-release-tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate-release-tag.outputs.release_ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: ${{ env.BINARY_NAME }}-*
          path: artifacts/
          merge-multiple: true

      - name: Download matching soma-provider wheelhouse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python_version="$(python3 -c 'import tomllib; print(tomllib.load(open("packages/python/pyproject.toml", "rb"))["project"]["version"])')"
          gh release download "soma-provider-v${python_version}" \
            --pattern '*.whl' \
            --dir artifacts \
            --repo "${GITHUB_REPOSITORY}"
          compgen -G 'artifacts/*.whl' >/dev/null

      - name: Generate SHA256SUMS and CycloneDX SBOM
        run: |
          set -euo pipefail
          python3 scripts/generate-release-sbom.py \
            --directory artifacts \
            --output artifacts/soma-release.cdx.json
          (cd artifacts && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | xargs sha256sum) > artifacts/SHA256SUMS
          cat artifacts/SHA256SUMS

      - name: Attest release provenance
        uses: actions/attest-build-provenance@e3fe62ef559997059fe8380e7d2b4c909e2d65f4
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.whl

      - name: Attest release SBOM
        uses: actions/attest-sbom@5729fe4dc697fb7538e4e94fd44d040aac1367b2
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.whl
          sbom-path: artifacts/soma-release.cdx.json

      - name: Upload assets to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ needs.validate-release-tag.outputs.release_tag }}" \
            artifacts/* \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
