name: Dependabot Auto-merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch/minor updates
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: dinglebear-ai/workflows/.github/workflows/dependabot-automerge.yml@364993bc854c4feb82cb26917e741fd6465cd47a
    with:
      allowed-update-types: version-update:semver-patch,version-update:semver-minor
      merge-method: squash
