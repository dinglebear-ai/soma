name: Python wheels

on:
  pull_request:
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/shared/provider-core/**"
      - "packages/python/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/python-wheels.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/shared/provider-core/**"
      - "packages/python/**"

permissions:
  contents: read

jobs:
  abi3-wheel:
    name: ${{ matrix.name }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            python: "3.11"
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            python: "3.11"
          - name: windows-x86_64
            runner: windows-latest
            python: "3.11"
          - name: macos-x86_64
            runner: macos-15-intel
            python: "3.11"
          - name: macos-arm64
            runner: macos-14
            python: "3.11"
          - name: linux-latest-python
            runner: ubuntu-latest
            python: "3.14"
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Build unoptimized abi3 wheel
        run: >-
          uv run --project packages/python --frozen maturin build
          --manifest-path packages/python/Cargo.toml
          --profile dev
          --out wheelhouse

      - name: Install built wheel
        run: >-
          python -c "import glob,subprocess,sys;
          wheel=glob.glob('wheelhouse/soma_provider-*.whl');
          assert len(wheel)==1, wheel;
          subprocess.check_call([sys.executable,'-m','pip','install',wheel[0]])"

      - name: Verify public and native contracts
        run: python -I packages/python/tests/verify_installed.py

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: soma-provider-${{ matrix.name }}-py${{ matrix.python }}
          path: wheelhouse/*.whl
          if-no-files-found: error
