name: Scale-set label smoke

on:
  push:
    branches:
      - codex/scale-set-label-smoke-20260731

permissions:
  contents: read

jobs:
  scalar-label:
    name: Scalar label routing
    runs-on: ci-pool-ops
    timeout-minutes: 5
    steps:
      - name: Report runner
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"

  label-array:
    name: Label array routing
    runs-on: [ci-pool-ops]
    timeout-minutes: 5
    steps:
      - name: Report runner
        run: |
          echo "runner_name=$RUNNER_NAME"
          echo "runner_os=$RUNNER_OS"

