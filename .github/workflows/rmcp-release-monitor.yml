name: rmcp release monitor

on:
  schedule:
    # Daily at 07:17 UTC. Offset minute avoids the scheduled-workflow stampede.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Watch rmcp crate releases
    runs-on: ci-pool-rust
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      GH_TOKEN: ${{ github.token }}
      MCP_SCHEMA_PATH: schema/2025-11-25/schema.ts
      MCP_SCHEMA_RAW_URL: https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/2025-11-25/schema.ts
      MCP_SCHEMA_WEB_URL: https://github.com/modelcontextprotocol/modelcontextprotocol/blob/main/schema/2025-11-25/schema.ts
      MCP_CONFORMANCE_REPO: modelcontextprotocol/conformance
      MCP_CONFORMANCE_URL: https://github.com/modelcontextprotocol/conformance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: gh
          cache: true

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Fetch rmcp crate metadata
        run: |
          curl -fsSL \
            -H "User-Agent: dinglebear-ai/soma rmcp-release-monitor" \
            https://crates.io/api/v1/crates/rmcp \
            -o rmcp-crate.json

      # CLICOLOR_FORCE=0 is load-bearing, not cosmetic. A runner setup
      # action exports CLICOLOR_FORCE=1 into GITHUB_ENV, so every later step
      # inherits it, and gh treats that as "force color on" even when stdout is
      # redirected to a file - NO_COLOR does not override it. Without this the
      # redirected payload is pretty-printed, ANSI-colorized JSON starting with
      # an ESC byte, and xtask fails with "expected value at line 1 column 1".
      - name: Fetch rmcp GitHub release notes
        env:
          CLICOLOR_FORCE: "0"
          NO_COLOR: "1"
        run: |
          gh api \
            "repos/modelcontextprotocol/rust-sdk/releases?per_page=100" \
            > rmcp-releases.json

      - name: Fetch MCP schema
        env:
          CLICOLOR_FORCE: "0"
          NO_COLOR: "1"
        run: |
          curl -fsSL "$MCP_SCHEMA_RAW_URL" -o mcp-schema-upstream.ts
          gh api \
            "repos/modelcontextprotocol/modelcontextprotocol/commits?path=${MCP_SCHEMA_PATH}&per_page=5" \
            > mcp-schema-commits.json

      - name: Fetch MCP conformance metadata
        env:
          CLICOLOR_FORCE: "0"
          NO_COLOR: "1"
        run: |
          baseline="$(tr -d '[:space:]' < docs/references/mcp/conformance/main.sha)"
          gh api "repos/${MCP_CONFORMANCE_REPO}/commits/main" > mcp-conformance-head.json
          gh api "repos/${MCP_CONFORMANCE_REPO}/compare/${baseline}...main" \
            > mcp-conformance-compare.json

      # Fail here, with the payload head, rather than 30s later inside a cargo
      # build with a serde message that names none of these files.
      - name: Validate fetched JSON payloads
        run: |
          set -uo pipefail
          status=0
          validate() {
            path="$1"
            want="$2"
            label="$3"
            if [ ! -s "$path" ]; then
              echo "::error file=${path}::${path} (${label}) is missing or empty; the fetch step wrote no payload"
              status=1
              return
            fi
            # cut, not head -c 1: head exits after one byte and SIGPIPEs tr,
            # which under pipefail fails the check on a perfectly good payload.
            first="$(tr -d '[:space:]' < "$path" | cut -c1)"
            if [ "$first" != "$want" ]; then
              echo "::error file=${path}::${path} (${label}) does not start with '${want}'; first 200 bytes follow with control characters escaped"
              echo "--- head of ${path} ($(wc -c < "$path") bytes) ---"
              head -c 200 "$path" | cat -v
              echo ""
              echo "--- end of head ---"
              status=1
            fi
          }
          validate rmcp-releases.json "[" "JSON array of GitHub releases"
          validate rmcp-crate.json "{" "crates.io crate metadata object"
          validate mcp-schema-commits.json "[" "JSON array of schema commits"
          validate mcp-conformance-head.json "{" "conformance head commit object"
          validate mcp-conformance-compare.json "{" "conformance compare object"
          exit "$status"

      - name: Render rmcp release issue body
        id: monitor
        run: |
          cargo xtask rmcp-release-monitor \
            --crate-json rmcp-crate.json \
            --releases-json rmcp-releases.json \
            --issue-body rmcp-release-issue.md \
            --schema-baseline docs/references/mcp/schema/2025-11-25/schema.ts \
            --schema-upstream mcp-schema-upstream.ts \
            --schema-commits-json mcp-schema-commits.json \
            --schema-url "$MCP_SCHEMA_WEB_URL" \
            --conformance-baseline docs/references/mcp/conformance/main.sha \
            --conformance-head-json mcp-conformance-head.json \
            --conformance-compare-json mcp-conformance-compare.json \
            --conformance-url "$MCP_CONFORMANCE_URL"

      - name: Open or update rmcp release issue
        if: steps.monitor.outputs.drift == 'true'
        env:
          CLICOLOR_FORCE: "0"
          NO_COLOR: "1"
        run: |
          title="${{ steps.monitor.outputs.issue_title }}"
          existing="$(
            gh issue list \
              --state open \
              --search "rmcp-release-monitor in:body" \
              --json number \
              --jq ".[0].number // \"\""
          )"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" \
              --title "$title" \
              --body-file rmcp-release-issue.md
          else
            gh issue create \
              --title "$title" \
              --body-file rmcp-release-issue.md
          fi

      - name: Close resolved rmcp release issue
        if: steps.monitor.outputs.drift == 'false'
        env:
          CLICOLOR_FORCE: "0"
          NO_COLOR: "1"
        run: |
          existing="$(
            gh issue list \
              --state open \
              --search "rmcp-release-monitor in:body" \
              --json number \
              --jq ".[0].number // \"\""
          )"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --body "The Soma rmcp pin, MCP schema baseline, and MCP conformance baseline are current; closing this release-monitor issue."
            gh issue close "$existing" \
              --comment "rmcp release monitor resolved."
          fi
