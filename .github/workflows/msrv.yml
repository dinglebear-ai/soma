name: MSRV

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    name: MSRV Changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ci-pool-rust
    timeout-minutes: 10
    outputs:
      workflow: ${{ steps.classify.outputs.workflow }}
      rust: ${{ steps.classify.outputs.rust }}
      native: ${{ steps.classify.outputs.native }}
      toml: ${{ steps.classify.outputs.toml }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >
          cargo run --manifest-path xtask/Cargo.toml -- changed-paths
          --event "$EVENT_NAME"
          --output "$GITHUB_OUTPUT"
          --write-changed-files changed-files.txt

      - name: Show changed files
        run: cat changed-files.txt || true

  msrv:
    name: Minimum Supported Rust Version
    needs: [changes]
    if: ${{ (needs.changes.outputs.rust == 'true' || needs.changes.outputs.native == 'true' || needs.changes.outputs.toml == 'true' || needs.changes.outputs.workflow == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: dinglebear-ai/workflows/.github/workflows/rust-msrv.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      msrv: "1.97.1"
      timeout-minutes: 40
      command: cargo check --all-targets --locked && cargo test --no-run --all-targets --locked --workspace --exclude soma-provider-python

  msrv-gate:
    name: MSRV Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - changes
      - msrv
    runs-on: ci-pool-rust
    timeout-minutes: 5
    steps:
      - name: Verify MSRV jobs passed or were intentionally skipped
        run: |
          set -euo pipefail
          require_success_or_skipped() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) printf '%s=%s\n' "$name" "$result" ;;
              *) echo "::error::$name concluded $result" >&2; exit 1 ;;
            esac
          }
          require_success_or_skipped changes "${{ needs.changes.result }}"
          require_success_or_skipped msrv "${{ needs.msrv.result }}"
