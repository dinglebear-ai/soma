name: Container and MCP Registry Release

on:
  release:
    types: [published]

concurrency:
  group: container-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    name: Validate release contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust-kache

      - id: validate
        name: Validate immutable release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::expected a semver release tag; got $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' apps/soma/Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./packages/soma-rmcp/package.json").version')"
          test "$cargo_version" = "$version"
          test "$npm_version" = "$version"
          cargo xtask check-version-sync
          echo "version=$version" >> "$GITHUB_OUTPUT"

  container:
    name: Build, verify, and publish amd64 image
    needs: [validate]
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@d7bbe71ddc1157e32ed0bebf928fc07438ba58b0
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      image: ghcr.io/dinglebear-ai/soma
      release-tag: ${{ needs.validate.outputs.version }}
      dockerfile: config/Dockerfile
      smoke-command: docker run --rm "$IMAGE_REF" --help
      cache-scope: soma-container-release
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  registry:
    name: Publish MCP Registry manifest
    needs: [validate, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" |
            tar xz mcp-publisher
          chmod +x mcp-publisher

      - name: Prepare immutable registry manifest
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("server.json")
          raw = path.read_text()
          data = json.loads(raw[raw.index("{"):])
          version = os.environ["VERSION"]
          image = f"ghcr.io/dinglebear-ai/soma:{version}"
          data["version"] = version
          for package in data.get("packages", []):
              if package.get("registryType") == "oci":
                  package["identifier"] = image
                  package.pop("version", None)
                  package.pop("registryBaseUrl", None)
              else:
                  package["version"] = version
          publisher = data.get("_meta", {}).get(
              "io.modelcontextprotocol.registry/publisher-provided", {}
          )
          distribution = publisher.get("distribution")
          if isinstance(distribution, dict):
              distribution.clear()
              distribution["ociImage"] = image
          path.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Publish to MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
          MCP_REGISTRY_DOMAIN: ${{ vars.MCP_REGISTRY_DOMAIN }}
        run: |
          test -n "$MCP_PRIVATE_KEY"
          test -n "$MCP_REGISTRY_DOMAIN"
          ./mcp-publisher login dns \
            --domain "$MCP_REGISTRY_DOMAIN" \
            --private-key "$MCP_PRIVATE_KEY"
          ./mcp-publisher publish
