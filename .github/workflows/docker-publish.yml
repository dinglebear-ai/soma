name: Container and MCP Registry Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vX.Y.Z release tag to resume
        required: true
        type: string

concurrency:
  group: container-release-${{ github.event.release.tag_name || inputs.tag_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag_name }}

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    name: Validate release contract
    if: startsWith(github.event.release.tag_name || inputs.tag_name, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.validate.outputs.version }}
      release_ref: ${{ steps.validate.outputs.release_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install validation system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libseccomp-dev

      - uses: ./.github/actions/setup-rust-kache

      - id: validate
        name: Validate immutable release version
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::expected a semver release tag; got $RELEASE_TAG"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' apps/soma/Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./packages/soma-rmcp/package.json").version')"
          test "$cargo_version" = "$version"
          test "$npm_version" = "$version"
          cargo xtask check-version-sync
          {
            echo "version=$version"
            echo "release_ref=refs/tags/${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

  container:
    name: Build, verify, and publish amd64 image
    needs: [validate]
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      checkout-ref: ${{ needs.validate.outputs.release_ref }}
      image: ghcr.io/dinglebear-ai/soma
      release-tag: ${{ needs.validate.outputs.version }}
      dockerfile: config/Dockerfile
      smoke-command: docker run --rm --entrypoint sh "$IMAGE_REF" -c 'command -v bwrap >/dev/null && command -v prlimit >/dev/null && python3 -I -c "import soma_provider.runner"' && docker run --rm "$IMAGE_REF" --help
      cache-scope: soma-container-release
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
