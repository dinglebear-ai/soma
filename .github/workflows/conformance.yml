name: MCP Conformance

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/conformance.yml"
      - "Justfile"
      - "conformance-baseline.yml"
      - "conformance/**"
      - "scripts/ci/mcp-conformance.sh"
      - "apps/soma/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: MCP 2026 full matrix
    runs-on: ci-pool-rust
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install just
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # just
        with:
          tool: just

      - name: Run pinned MCP conformance matrix
        run: just conformance-matrix

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-conformance-2026-07-28
          path: target/mcp-conformance/
          if-no-files-found: ignore
          retention-days: 14
