name: Fleet Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Fleet Policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@364993bc854c4feb82cb26917e741fd6465cd47a
    with:
      release-file-regex: '(^|/)(release|docker-publish|python-wheels)\.ya?ml$'

  contract:
    name: Fleet Contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@364993bc854c4feb82cb26917e741fd6465cd47a
    with:
      profile: rust
      implementation-ref: 364993bc854c4feb82cb26917e741fd6465cd47a
