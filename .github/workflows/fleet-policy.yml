name: Fleet Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Fleet Policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      allow-hosted-fast: true
      release-file-regex: '(^|/)(release|docker-publish|python-wheels)\.ya?ml$'

  contract:
    name: Fleet Contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      profile: rust
      implementation-ref: ac57c3208cf92d71c5971bb936df51c400cb1ccf
