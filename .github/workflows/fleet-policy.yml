name: Fleet Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Fleet Policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@d1a41a7af9c41189e0f1062234364f5814bda99d
    with:
      allow-hosted-fast: true
      release-file-regex: '(^|/)(release|docker-publish|python-wheels)\.ya?ml$'

  contract:
    name: Fleet Contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@d1a41a7af9c41189e0f1062234364f5814bda99d
    with:
      profile: rust
      implementation-ref: d1a41a7af9c41189e0f1062234364f5814bda99d
