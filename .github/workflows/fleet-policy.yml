name: Fleet Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    name: Fleet Policy
    uses: dinglebear-ai/workflows/.github/workflows/fleet-policy.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      release-file-regex: '(^|/)(release|docker-publish|python-wheels)\.ya?ml$'

  contract:
    name: Fleet Contract
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@98e40816bfab64ed9fcce82236e9ecb0c0055d7d
    with:
      profile: rust
      implementation-ref: 98e40816bfab64ed9fcce82236e9ecb0c0055d7d
