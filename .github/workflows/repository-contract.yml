name: Repository contract

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: repository-contract-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  contract:
    permissions:
      contents: read
    uses: dinglebear-ai/workflows/.github/workflows/fleet-contract.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf # fleet-2026-07-31
    with:
      profile: rust
      implementation-ref: ac57c3208cf92d71c5971bb936df51c400cb1ccf
    secrets: inherit

  repository-contract:
    name: Repository Contract
    if: always()
    needs: [contract]
    runs-on: ci-pool-ops
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require repository contract
        env:
          RESULT: ${{ needs.contract.result }}
        run: |
          if [[ "$RESULT" != "success" ]]; then
            echo "repository contract concluded $RESULT" >&2
            exit 1
          fi
