# =============================================================================
# .github/workflows/ci.yml — Continuous Integration
#
# CUSTOMIZATION NOTES:
#   REPO_NAME   → your GitHub repo name (e.g. "myservice-mcp")
#   BINARY_NAME → your binary name from Cargo.toml [[bin]] (e.g. "myservice")
#
# This workflow runs on every push and PR to main.
# Jobs: reusable operations/Rust/web/security checks, product-specific tests,
# MCP smoke, TOML checks, Soma contracts, and the required aggregate gate.
#
# All jobs must pass before merging. Adjust the matrix rust-version to match
# your Cargo.toml `rust-version` field.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Product-specific builds route through kache (RUSTC_WRAPPER, set by
  # ./.github/actions/setup-rust-kache). The LOCAL store is per-runner under
  # $GITHUB_WORKSPACE/../.kache and must never be shared because kache's SQLite
  # index cannot be held across containers. The only SHARED surface is the
  # private MinIO prefix s3://kache/rust. The GitHub-hosted native Windows job
  # runs without any compile wrapper.

jobs:
  changes:
    name: Changes
    if: >-
      ${{
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository) &&
        (github.event_name != 'pull_request' ||
         !startsWith(github.head_ref, 'release-please--branches--main--components--soma'))
      }}
    runs-on: ci-pool-rust
    timeout-minutes: 10
    outputs:
      all: ${{ steps.classify.outputs.all }}
      docs: ${{ steps.classify.outputs.docs }}
      workflow: ${{ steps.classify.outputs.workflow }}
      rust: ${{ steps.classify.outputs.rust }}
      web: ${{ steps.classify.outputs.web }}
      native: ${{ steps.classify.outputs.native }}
      mcp: ${{ steps.classify.outputs.mcp }}
      docker: ${{ steps.classify.outputs.docker }}
      toml: ${{ steps.classify.outputs.toml }}
      soma: ${{ steps.classify.outputs.soma }}
      security: ${{ steps.classify.outputs.security }}
      secrets: ${{ steps.classify.outputs.secrets }}
      release: ${{ steps.classify.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >
          cargo run --manifest-path xtask/Cargo.toml -- changed-paths
          --event "$EVENT_NAME"
          --output "$GITHUB_OUTPUT"
          --write-changed-files changed-files.txt

      - name: Show changed files
        run: cat changed-files.txt || true

  actionlint:
    name: Actionlint and ShellCheck
    needs: [changes]
    if: ${{ needs.changes.outputs.workflow == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: dinglebear-ai/workflows/.github/workflows/fast-ops.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      actionlint-version: v1.7.12
      shell-globs: .github/scripts/**/*.sh
      timeout-minutes: 10

  rust-fast:
    name: Fast Rust
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: dinglebear-ai/workflows/.github/workflows/fast-rust.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      toolchain: "1.97.1"
      timeout-minutes: 35
      kache-manifest-key: soma-fast-rust
      uv-version: "0.11.31"
      setup-command: uv sync --project packages/python --frozen
      test-command: >-
        mkdir -p "$RUNNER_TEMP/soma-fast-rust-cargo" &&
        { test ! -f "$CARGO_HOME/config.toml" || cp "$CARGO_HOME/config.toml" "$RUNNER_TEMP/soma-fast-rust-cargo/config.toml"; } &&
        { test ! -f "$CARGO_HOME/config" || cp "$CARGO_HOME/config" "$RUNNER_TEMP/soma-fast-rust-cargo/config"; } &&
        CARGO_HOME="$RUNNER_TEMP/soma-fast-rust-cargo" cargo test --workspace --locked --exclude soma-provider-python
    secrets:
      KACHE_S3_ACCESS_KEY: ${{ secrets.KACHE_S3_ACCESS_KEY }}
      KACHE_S3_SECRET_KEY: ${{ secrets.KACHE_S3_SECRET_KEY }}

  # ── architecture: dependency-layer boundary checks ───────────────────────────
  architecture:
    name: Architecture
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ci-pool-rust
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Check architecture boundaries
        run: cargo xtask check-architecture

      - name: Check self-update production library features
        run: cargo check -p soma-self-update --lib --locked

  # ── test: cargo nextest run --profile ci ─────────────────────────────────────
  test:
    name: Test
    needs: [changes]
    if: ${{ needs.changes.outputs.rust == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ci-pool-rust
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Install cargo-nextest
        uses: taiki-e/install-action@95cc2373c3f00275e315c306e56fef1c7a8854c0 # cargo-nextest

      # This job runs `just test-python*` below but never installed `just` - it
      # inherited whatever the runner happened to have. Provision it explicitly.
      - name: Set up mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: just
          cache: true

      - name: Build stdio test binary
        run: cargo build --bin soma

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: true

      - name: Python provider SDK tests
        run: just test-python

      - name: Python provider package smoke test
        run: just test-python-package

      - name: Install component target
        run: rustup target add wasm32-wasip2

      - name: Build reference component
        run: >-
          cargo build
          --manifest-path examples/providers/components/reference-provider/Cargo.toml
          --target wasm32-wasip2
          --locked

      - name: Reference component cross-runtime conformance
        env:
          SOMA_REFERENCE_COMPONENT: examples/providers/components/reference-provider/target/wasm32-wasip2/debug/soma_reference_component_provider.wasm
        run: >-
          cargo test -p soma --test wasm_provider
          reference_component_matches_cross_runtime_fixture
          -- --ignored --exact

      - name: cargo nextest run --profile ci
        run: cargo nextest run --profile ci

      # nextest does not execute doctests (cargo-nextest#16), so ///-example
      # code would otherwise never be compiled or run anywhere in CI. Keep this
      # step directly after the nextest run so both share the same cache/env.
      - name: cargo test --doc
        run: cargo test --doc --workspace --locked

      - name: soma-gateway all-features tests
        run: cargo test -p soma-gateway --all-features

      - name: codex app-server REST tests
        run: cargo test -p codex-app-server-client --features rest --locked

      - name: kache gate
        if: always()
        env:
          KACHE_GATE_MIN_HIT_RATE: "0"
          KACHE_GATE_REQUIRE_REMOTE: "0"
          KACHE_GATE_REQUIRE_DAEMON: "1"
        run: ./scripts/kache-gate.sh

      - name: Upload nextest report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  frontend-assets:
    name: Frontend checks
    needs: [changes]
    if: ${{ (needs.changes.outputs.web == 'true' || needs.changes.outputs.native == 'true' || needs.changes.outputs.mcp == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: dinglebear-ai/workflows/.github/workflows/fast-pnpm.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      node-version: "22"
      pnpm-version: "10"
      working-directory: apps/web
      lockfile-path: apps/web/pnpm-lock.yaml
      audit-command: ""
      test-command: pnpm test
      build-command: pnpm build
      timeout-minutes: 20

  container-smoke:
    name: Production container Python smoke
    needs: [changes]
    if: ${{ needs.changes.outputs.docker == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --file config/Dockerfile --tag soma:container-smoke .

      - name: Verify persistent provider startup and hot reload
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh soma:container-smoke \
            -c 'command -v bwrap >/dev/null && command -v prlimit >/dev/null && python3 -I -c "import soma_provider.runner"'
          data_dir="${RUNNER_TEMP}/soma-container-smoke"
          provider_dir="${RUNNER_TEMP}/soma-container-providers"
          mkdir -p "${data_dir}" "${provider_dir}"
          cp examples/providers/python/async_provider.py "${provider_dir}/async_provider.py"
          container_id="$(docker run --detach --rm \
            -e SOMA_HOME=/data \
            -e SOMA_PROVIDER_DIR=/providers \
            -e SOMA_PYTHON_RUNNER_MODE=persistent \
            -e SOMA_PYTHON_EXECUTION_PROFILE=trusted \
            -e SOMA_MCP_HOST=0.0.0.0 \
            -e SOMA_NOAUTH=true \
            -p 127.0.0.1::40060 \
            -v "${data_dir}:/data" \
            -v "${provider_dir}:/providers:ro" \
            soma:container-smoke)"
          trap 'docker rm --force "${container_id}" >/dev/null 2>&1 || true' EXIT
          port="$(docker port "${container_id}" 40060/tcp | sed -n 's/.*://p')"
          for _ in $(seq 1 50); do
            curl -fs "http://127.0.0.1:${port}/health" >/dev/null && break
            sleep 0.2
          done
          curl -fsS \
            -H 'Content-Type: application/json' \
            --data '{"message":"before"}' \
            "http://127.0.0.1:${port}/v1/tools/delayed_echo" | grep -Fq 'before'

          cp examples/providers/python/decorated_context.py \
            "${provider_dir}/async_provider.py.next"
          mv "${provider_dir}/async_provider.py.next" \
            "${provider_dir}/async_provider.py"
          for _ in $(seq 1 50); do
            if curl -fsS \
              -H 'Content-Type: application/json' \
              --data '{"message":"after"}' \
              "http://127.0.0.1:${port}/v1/tools/request-summary" | grep -Fq 'after'; then
              exit 0
            fi
            sleep 0.2
          done
          docker logs "${container_id}"
          exit 1

  # -- mcp-smoke: live MCP HTTP tool/resource smoke through mcporter -----------
  mcp-smoke:
    name: MCP Smoke
    runs-on: ci-pool-rust
    needs: [changes, frontend-assets]
    if: ${{ always() && (needs.changes.outputs.mcp == 'true' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.web == 'true') && needs.frontend-assets.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1


      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Set up mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: node npm:mcporter
          cache: true

      - name: Build web assets for MCP smoke
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm build

      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
          key: ${{ github.repository }}-mcp-smoke-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ github.repository }}-mcp-smoke-

      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build Soma full binary
        run: cargo build --locked --bin soma --features full

      - name: Start MCP server
        env:
          SOMA_MCP_HOST: 127.0.0.1
          SOMA_MCP_PORT: 40123
          SOMA_MCP_NO_AUTH: "true"
          RUST_LOG: info,rmcp=warn
        run: |
          set -euo pipefail
          ./target/debug/soma serve > /tmp/soma-mcp.log 2>&1 &
          echo "$!" > /tmp/soma-mcp.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:40123/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/soma-mcp.log
          exit 1

      - name: Run mcporter smoke tests
        env:
          SOMA_MCP_HOST: 127.0.0.1
          SOMA_MCP_PORT: 40123
        run: bash apps/soma/tests/mcporter/test-mcp.sh --timeout-ms 20000

      - name: Upload MCP smoke logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcp-smoke-logs
          path: |
            /tmp/soma-mcp.log
            /tmp/test-mcp.*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop MCP server
        if: always()
        run: |
          kill "$(cat /tmp/soma-mcp.pid 2>/dev/null)" 2>/dev/null || true

  # ── toml: taplo check ─────────────────────────────────────────────────────────
  toml:
    name: TOML Format
    needs: [changes]
    if: ${{ needs.changes.outputs.toml == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ci-pool-rust
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      - name: Install taplo
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: cargo:taplo-cli
          cache: true

      - name: taplo check
        run: taplo check

  # -- lefthook-speed: pre-commit must stay staged and fast ---------------------
  lefthook-speed:
    name: Lefthook Speed
    needs: [changes]
    if: ${{ (needs.changes.outputs.workflow == 'true' || needs.changes.outputs.soma == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ci-pool-ops
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pre-commit hook speed policy
        run: python3 scripts/check_lefthook_pre_commit_speed.py

  # ── soma: generated docs, plugin layout, coupled files ───────────────────────
  soma:
    name: Soma Contracts
    needs: [changes]
    if: ${{ needs.changes.outputs.soma == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ci-pool-rust
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache

      # Only used by "Check TypeScript REST client" below - `cargo xtask
      # check-ts-client` itself skips gracefully (exit 0) if node/pnpm end up
      # missing from PATH for any reason, so this step is not load-bearing
      # for the rest of this job's Rust-only checks.
      - name: Set up mise tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install_args: node pnpm
          cache: true

      - name: Build xtask once
        # Every check below is one `cargo xtask` call, and the alias expands to
        # `cargo run --package xtask --`. Cargo re-verifies freshness across
        # xtask's whole dependency graph on each of those calls — ~40s a piece
        # on this runner, which dominated this job's runtime even
        # when nothing needs recompiling. Build the binary once and invoke it
        # directly instead (~0.2s per call).
        run: |
          cargo build --package xtask
          echo "XTASK=$PWD/target/debug/xtask" >> "$GITHUB_ENV"

      - name: Check PATTERNS.md contracts
        run: '"$XTASK" patterns'

      - name: Check test sibling coverage
        run: '"$XTASK" check-test-siblings'

      - name: Validate plugin layout
        run: '"$XTASK" validate-plugin-layout'

      - name: Check generated docs
        run: '"$XTASK" check-docs'

      - name: Check stale Soma claims
        run: '"$XTASK" check-stale-claims'

      - name: Check schema docs
        run: '"$XTASK" check-schema-docs --check'

      - name: Check OpenAPI docs
        run: '"$XTASK" check-openapi --check'

      - name: Check TypeScript REST client
        run: '"$XTASK" check-ts-client --check'

      - name: Check MCP registry manifest
        run: '"$XTASK" check-mcp-registry'

      - name: Check provider manifest contract
        run: '"$XTASK" check-provider-manifest-contract'

      - name: Check Palette manifest
        run: '"$XTASK" check-palette-manifest --check'

      - name: Check scaffold intent contract
        run: '"$XTASK" check-scaffold-intent-contract'

      - name: Check version-bearing files are in sync
        run: '"$XTASK" check-version-sync'

      - name: Run Soma feature smoke tests
        run: '"$XTASK" test-soma-features'

      - name: Check blob sizes
        run: '"$XTASK" check-blob-size --base origin/main --head HEAD'

      - name: Check coupled files
        run: '"$XTASK" check-coupled-files origin/main HEAD'

      - name: ASCII hygiene
        run: '"$XTASK" run-ascii-check'

  audit:
    name: Cargo Deny
    needs: [changes]
    if: ${{ needs.changes.outputs.security == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    uses: dinglebear-ai/workflows/.github/workflows/rust-security.yml@ac57c3208cf92d71c5971bb936df51c400cb1ccf
    with:
      toolchain: "1.97.1"
      cargo-deny-version: "0.19.8"
      command: cargo deny check all
      timeout-minutes: 20

  npm-launcher:
    name: npm launcher
    needs: [changes]
    if: ${{ needs.changes.outputs.release == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify npm launcher
        working-directory: packages/soma-rmcp
        run: |
          node scripts/sync-readme.js
          npm test
          npm run check
          npm pack --dry-run --json

  release-contract:
    name: Release Contract
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main--components--soma') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version surfaces
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PYTHON'
          import json
          import tomllib
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / '.release-please-manifest.json').read_text())
          expected = manifest['.']
          package = json.loads((root / 'packages/soma-rmcp/package.json').read_text())
          server = json.loads((root / 'server.json').read_text())
          openapi = json.loads((root / 'docs/generated/openapi.json').read_text())
          cargo = tomllib.loads((root / 'apps/soma/Cargo.toml').read_text())
          lock = tomllib.loads((root / 'Cargo.lock').read_text())
          locked = {
              entry['name']: entry['version']
              for entry in lock['package']
              if entry['name'] == 'soma'
          }
          npm_package = next(
              entry for entry in server['packages']
              if entry.get('registryType') == 'npm'
          )
          oci_package = next(
              entry for entry in server['packages']
              if entry.get('registryType') == 'oci'
          )
          versions = {
              'cargo': cargo['package']['version'],
              'cargo-lock': locked['soma'],
              'npm': package['version'],
              'npm-binary': package['binaryVersion'],
              'server': server['version'],
              'server-npm': npm_package['version'],
              'openapi': openapi['info']['version'],
          }
          mismatches = {
              name: version for name, version in versions.items()
              if version != expected
          }
          assert not mismatches, mismatches
          assert npm_package['identifier'] == '@dinglebear/soma'
          assert oci_package['identifier'] == f'ghcr.io/dinglebear-ai/soma:{expected}'
          fixup = (root / '.github/workflows/release-please.yml').read_text()
          assert 'cargo xtask check-openapi --write' in fixup
          print(f'Release contract is synchronized at {expected}.')
          PYTHON

  # ── ci-gate: single required status that aggregates every job ────────────────
  # Point branch protection at THIS job ("CI Gate") instead of each job below.
  # It fails if any needed job ended in anything other than success or skipped,
  # which closes the "a required check was silently skipped" merge hole.
  ci-gate:
    name: CI Gate
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - changes
      - actionlint
      - architecture
      - rust-fast
      - test
      - frontend-assets
      - container-smoke
      - mcp-smoke
      - toml
      - lefthook-speed
      - soma
      - audit
      - npm-launcher
      - release-contract
    runs-on: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-please--branches--main--components--soma') && 'ubuntu-24.04' || 'ci-pool-ops' }}
    timeout-minutes: 5
    steps:
      - name: Verify all required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              echo "::error::A required CI job did not pass (result: ${result})"
              exit 1
            fi
          done
          echo "All required CI jobs passed or were skipped."
