# MCP conformance expected-failures baseline (official @modelcontextprotocol/conformance).
#
# Scenarios the soma server does not satisfy out of the box, recorded so
# `just conformance` fails only on a NEW regression — and flags any baselined
# scenario that starts passing as a stale entry to remove.
#
# Updated 2026-07-28 against `--suite all --spec-version 2026-07-28` with
# SOMA_MCP_CONFORMANCE_FIXTURES=true on a no-auth loopback server. The
# `MCP 2026 full matrix` job (.github/workflows/conformance.yml) scores
# against that newer spec; the previous baseline only covered the older
# `active` suite, which is why that job had never passed.
#
# The CORE protocol scenarios PASS — server-initialize, ping, tools-list,
# resources-list, prompts-list, completion-complete, dns-rebinding-protection —
# so the server is structurally conformant with the current spec. The entries
# below fail for two benign reasons, not protocol violations:
#
#   1. The server runs in JSON-response mode, so the multiple-SSE-stream
#      transport scenario does not apply to Soma harness.
#   2. Progress and elicitation reference-fixture scenarios need live client
#      notification/input round trips beyond the static fixture overlay.
#   3. Logging, sampling, and resource subscriptions are deprecated/removed in
#      the draft protocol and are intentionally not implemented here.
#
# Regenerate the failing list with: just conformance
server:
  - logging-set-level
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - resources-subscribe
  - resources-unsubscribe
  # Pending SEP-1699 transport experiment. Removed in the draft protocol and not
  # implemented by this JSON-response conformance harness.
  - server-sse-polling

  # ── 2026-07-28 spec features not implemented yet ────────────────────────────
  # These are genuine gaps, not harness artifacts: the newer spec adds the
  # input-required-result (MRTR) round-trip family, a stateless server mode,
  # SEP-2164 resource-not-found semantics, and custom-header server validation.
  # Baselined so the gate catches REGRESSIONS while the work is tracked
  # separately; delete each entry as it starts passing.
  - server-stateless
  - sep-2164-resource-not-found
  - http-custom-header-server-validation
  - input-required-result-basic-elicitation
  - input-required-result-basic-sampling
  - input-required-result-basic-list-roots
  - input-required-result-request-state
  - input-required-result-multiple-input-requests
  - input-required-result-multi-round
  - input-required-result-missing-input-response
  - input-required-result-non-tool-request
  - input-required-result-result-type
  - input-required-result-tampered-state
  - input-required-result-capability-check
  - input-required-result-ignore-extra-params
