[package]
name = "labby-palette-tauri"
version = "0.1.0"
description = "Tauri command palette for the Labby gateway API"
edition = "2024"
rust-version = "1.97.1"
license = "AGPL-3.0-only"
publish = false

[workspace]

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
bare_urls = "warn"
unescaped_backticks = "warn"
redundant_explicit_links = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
doc_markdown = "warn"

[lints]
workspace = true

[lib]
name = "labby_palette_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "labby-palette-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
open = "5"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Palette product DTOs, `/v1/palette/*` path constants, and error shapes
# shared with the Soma HTTP server — not a root workspace member (this
# package isn't either; see the `[workspace]` table above), consumed by path.
soma-palette = { path = "../../../crates/soma/palette" }
# Reusable, product-neutral Tauri window/tray/shortcut/blur/persistence and
# command-result mechanics — not a root workspace member (this package isn't
# either; see the `[workspace]` table above), consumed by path.
soma-tauri-shell = { path = "../../../crates/shared/tauri-shell" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["sync", "net", "io-util", "time", "macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
