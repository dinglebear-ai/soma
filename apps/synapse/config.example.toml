[server]
bind = "127.0.0.1:40070"
# Protect /operations, /activity, /openapi.json, /v1/*, and /mcp.
# Health, readiness, and status remain unauthenticated.
api_token = "replace-with-a-long-random-token"
# False requires CLI --yes, REST confirmed=true, or successful MCP elicitation.
allow_mutations = false
request_timeout_secs = 30
authorization_ttl_secs = 60
default_host = "local"
max_fanout_concurrency = 8

[[hosts]]
id = "local"
read_roots = ["/srv", "/var/log"]
build_roots = ["/srv/build"]
transfer_source_roots = ["/srv/export"]
transfer_destination_roots = ["/srv/import"]
labels = ["local"]

[hosts.endpoint]
kind = "local"

[[hosts]]
id = "nashost"
read_roots = ["/srv/data", "/srv/appdata", "/var/log"]
build_roots = ["/srv/appdata/compose"]
transfer_source_roots = ["/srv/data"]
transfer_destination_roots = ["/srv/data"]
labels = ["nas", "docker"]
docker_socket = "/var/run/docker.sock"

[hosts.endpoint]
kind = "ssh"
host = "nashost"
port = 22
user = "synapse"
identity_file = "/home/synapse/.ssh/id_ed25519"
config_file = "/home/synapse/.ssh/config"
known_hosts_file = "/home/synapse/.ssh/known_hosts"
